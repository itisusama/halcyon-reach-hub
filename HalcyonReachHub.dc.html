<!DOCTYPE html>
<html>

<meta charset="utf-8">

<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:wght@500&family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">

<style>
  :root{--evergreen:#0F3B2E;--evergreen-dark:#0A2A20;--gold:#C9A24B;--gold-soft:#E4CC8F;--cream:#F7F5EE;--charcoal:#1F2421;--stone:#6B6B63;--border:#E2DFD3;--danger:#A03A2E;--success:#4A7C59}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--cream);color:var(--charcoal);font-size:14px;line-height:1.45}
  a{color:var(--evergreen);text-decoration:none}
  a:hover{color:var(--gold)}
  h1,h2,h3,h4{margin:0}
  .frn{font-family:Fraunces,Georgia,serif;font-weight:500;letter-spacing:-0.01em}
  .urdu{font-family:'Noto Nastaliq Urdu',serif;direction:rtl}
  .old-card{background:#fff;border:1px solid #999;border-radius:2px;padding:8px;font-size:12px;box-shadow:2px 2px 0 #ccc;font-family:Tahoma,Arial,sans-serif}
  .old-btn{background:linear-gradient(#fff,#ddd);border:1px solid #555;border-radius:2px;padding:3px 12px;font-size:12px;box-shadow:2px 2px 3px rgba(0,0,0,.35);cursor:pointer;font-family:Tahoma,Arial,sans-serif;color:#000}
  .old-btn:hover{background:linear-gradient(#eee,#ccc)}
  .old-btn.gold{background:linear-gradient(#E4CC8F,#C9A24B);border-color:#8a6d2f;color:#1F2421;font-weight:bold}
  .old-table{border-collapse:collapse;font-size:11px;width:100%;font-family:Tahoma,Arial,sans-serif}
  .old-table th{background:#d8d8d0;border:1px solid #888;padding:3px 6px;text-align:left;font-weight:bold;color:#000}
  .old-table td{border:1px solid #bbb;padding:2px 6px;vertical-align:top}
  .old-table tr:nth-child(even) td{background:#ececec}
  .new-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .new-btn{background:var(--evergreen);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
  .new-btn:hover{background:var(--evergreen-dark)}
  .new-btn.gold{background:var(--gold);color:#1F2421}
  .new-btn.gold:hover{background:var(--gold-soft)}
  .new-btn.ghost{background:transparent;color:var(--evergreen);border:1px solid var(--border)}
  .new-table{border-collapse:collapse;width:100%;font-size:14px}
  .new-table th{text-align:left;padding:12px 16px;border-bottom:1px solid var(--border);color:var(--stone);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .new-table td{padding:14px 16px;border-bottom:1px solid var(--border)}
  .badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:600;font-family:Tahoma,Arial,sans-serif;letter-spacing:.02em}
  input,select,textarea{font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--charcoal);outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--evergreen)}
  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#d0cec2;border-radius:4px}
  .navlink{display:block;padding:8px 20px;color:rgba(255,255,255,.82);font-size:13px;cursor:pointer;border-left:3px solid transparent}
  .navlink:hover{background:rgba(255,255,255,.05);color:#fff}
  .navlink.active{background:var(--evergreen-dark);border-left-color:var(--gold);color:#fff;font-weight:500}
  .navgroup{padding:14px 20px 4px;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.4);font-weight:600}
  .modal-overlay{position:fixed;inset:0;background:rgba(15,59,46,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px}
  .avatar{width:44px;height:44px;border-radius:50%;background:var(--gold);color:var(--evergreen-dark);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex-shrink:0}
</style>
</helmet>
<sc-if value="{{ fullScreen }}" hint-placeholder-val="{{ false }}">
  <div>{{ page }}</div>
</sc-if>
<sc-if value="{{ shellMode }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;min-height:100vh">
  <aside style="width:240px;background:var(--evergreen);color:#fff;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto">
    <div style="padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px" onclick="{{ navHome }}">
      <div style="width:22px;height:22px;border-radius:50%;background:var(--gold)"></div>
      <div class="frn" style="font-size:18px;cursor:pointer">Halcyon Reach</div>
    </div>
    <nav style="padding:12px 0;flex:1">{{ sidebarEl }}</nav>
    <div style="padding:12px 20px;font-size:10px;color:rgba(255,255,255,.4);border-top:1px solid rgba(255,255,255,.08);line-height:1.5">
      hub v2019.4-patched<br>Zoya build #118 · Nov 2025

  </aside>
  <main style="flex:1;display:flex;flex-direction:column;min-width:0">
    <header style="height:56px;background:var(--cream);border-bottom:1px solid var(--evergreen);display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0">
      <input placeholder="Search the hub…" style="flex:1;max-width:420px">
      <div style="flex:1"></div>
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:32px;height:32px;border-radius:50%;background:var(--gold);color:var(--evergreen-dark);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px">AD</div>

          <div style="font-weight:500;font-size:13px">Admin (You)</div>

        </div>
      </div>
    </header>
    <div style="flex:1;padding:32px;max-width:1400px;width:100%">{{ page }}</div>
  </main>
</div>
</sc-if>

const VACANT_IDS = ['R4','H4','H6','T3','F7','C7','C15','C18','C24','W7','W13','V5','V11','ST7','A9','A16','A23','A30','D8','D16','D23','S8','S15','P8','P11','M8','M12','I9','I12','E7'];

// manager mapping: dept -> head id; head reports as noted in brief
const HEAD = {'Reception & Admin':'R2','IT':'T1','HR':'H1','Finance':'F1','Creative':'C1','Copywriting':'W1','Video':'V1','Strategy':'ST1','Executive':'E1','Account Management':'E6','Digital':'D1','Social':'S1','PR':'P1','Media Buying':'M1','Analytics':'I1'};
// where each head reports
const HEAD_UP = {'R2':'H1','R3':'H1','T1':'E1','H1':'E3','F1':'E5','C1':'E2','W1':'E2','V1':'E2','ST1':'E1','D1':'E8','S1':'E8','P1':'E8','M1':'E4','I1':'E4','E2':'E1','E3':'E1','E4':'E1','E5':'E1','E6':'E1','E8':'E1'};

const PEOPLE = (() => {
  const arr = ROSTER_RAW.trim().split('\n').map((line, idx) => {
    const [id,gender,age,name,role,dept,floor] = line.split('|');
    const [first, ...rest] = name.split(' ');
    const last = rest.join('.').toLowerCase();
    const email = first.toLowerCase() + '.' + last.replace(/[^a-z]/g,'') + '@halcyonreach.com';
    return { id, code:id, name, gender, age:+age, role, department:dept, floor:+floor, email, extension: String(200 + idx).slice(-3).padStart(3,'0'), vacant:false };
  });
  // manager assignment
  arr.forEach(p => {
    if (HEAD_UP[p.id]) { p.managerId = HEAD_UP[p.id]; }
    else if (p.id === 'E1') { p.managerId = null; }
    else { p.managerId = HEAD[p.department]; }
  });
  // vacants
  VACANT_IDS.forEach(vid => arr.push({ id:vid, code:vid, vacant:true, department: deptFromId(vid), floor: floorFromDept(deptFromId(vid)) }));
  return arr;
})();

function deptFromId(id) {
  const prefix = id.match(/^[A-Z]+/)[0];
  return {R:'Reception & Admin',T:'IT',H:'HR',F:'Finance',C:'Creative',W:'Copywriting',V:'Video',ST:'Strategy',E:'Executive',A:'Account Management',D:'Digital',S:'Social',P:'PR',M:'Media Buying',I:'Analytics'}[prefix];
}
function floorFromDept(d) {
  return ({'Reception & Admin':1,'IT':1,'HR':1,'Finance':1,'Creative':2,'Copywriting':2,'Video':2,'Strategy':2})[d] || 3;
}
function findPerson(id) { return PEOPLE.find(p => p.id === id); }
function findByName(name) { return PEOPLE.find(p => p.name === name); }
function initials(n) { return n.split(' ').map(s=>s[0]).slice(0,2).join('').toUpperCase(); }

// ========== DATE HELPERS ==========
function today() { const d = new Date(); d.setHours(0,0,0,0); return d; }
function subDays(d,n) { const x = new Date(d); x.setDate(x.getDate()-n); return x; }
function addDays(d,n) { return subDays(d,-n); }
function fmt(d) { return d.toISOString().slice(0,10); }
function fmtNice(d) { return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDay(d) { return d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'}); }
function pad(n){return String(n).padStart(2,'0')}
function hm(h,m){return pad(h)+':'+pad(m)}

// most recent Tuesday at least 2 days ago
function recentTuesday() {
  let d = subDays(today(), 2);
  while (d.getDay() !== 2) d = subDays(d, 1);
  return d;
}
const RECENT_TUE = recentTuesday();

// deterministic PRNG
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rng = mulberry32(20260926);
function pick(arr){return arr[Math.floor(rng()*arr.length)]}

const VISITORS_SEED = (() => {

    const dow = day.getDay(); // 0 sun..6 sat

      out.push({
        id: 'V'+String(seq++).padStart(5,'0'),
        date: day, dow,
        timeIn: hm(hIn,mIn),
        timeOut: hm(Math.min(hIn+durH,19), Math.floor(rng()*60)),

  failSlots.forEach(s => {
    out.push({
      id: 'V'+String(seq++).padStart(5,'0'),

  const overrideSlots = [

    { day: subDays(today(), 17), hour: 20, min: 12 },

// ========== SEED: 12mo failed writes for glitches ==========
const FAIL_12MO = (() => {
  const out = [];
  const faraz = findPerson('E2');
  const otherHosts = NAMED_HOSTS.filter(p => p.id !== 'E2');
  for (let w=0;w<52;w++) {
    // Tue cluster 15-17
    if (rng() < 0.75) {
      const d = subDays(today(), w*7 + (rng()<.5?0:7));
      let t = new Date(d); while (t.getDay()!==2) t = subDays(t,1);
      const isFaraz = rng() < 0.62;
      out.push({ date: t, dow: 2, hour: 15+Math.floor(rng()*3), min: Math.floor(rng()*60), hostId: isFaraz ? 'E2' : pick(otherHosts).id });
    }
    // Fri cluster 10-12
    if (rng() < 0.55) {
      const d = subDays(today(), w*7);
      let t = new Date(d); while (t.getDay()!==5) t = subDays(t,1);
      const isFaraz = rng() < 0.45;
      out.push({ date: t, dow: 5, hour: 10+Math.floor(rng()*3), min: Math.floor(rng()*60), hostId: isFaraz ? 'E2' : pick(otherHosts).id });
    }
    // scattered noise
    if (rng() < 0.25) {
      const d = subDays(today(), w*7 + Math.floor(rng()*7));
      out.push({ date: d, dow: d.getDay(), hour: 9+Math.floor(rng()*9), min: Math.floor(rng()*60), hostId: pick(otherHosts).id });
    }
  }
  return out.filter(e => e.dow !== 0);
})();

  pageExecCalendar() {
    const showDetail = this.state.view.calDetail !== false;
    const revealGaps = this.state.view.revealGaps;
    const execs = PEOPLE.filter(p => p.department === 'Executive' && !p.vacant);
    const slots = ['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'];
    // build fake schedule
    const status = (e, i) => {
      if (e.id === 'E2' && new Date().getDay() === 5 && (i>=2 && i<=4)) return showDetail && revealGaps ? {t:'Not in office', c:'#f4d4cf', cl:'#7a1e13'} : {t:'In meeting', c:'#dfeee2', cl:'#28502e'};
      const seed = (e.id.charCodeAt(1) + i) % 4;
      if (seed === 0) return {t:'Out', c:'#f0eee2', cl:'#7a7a68'};
      if (seed === 1) return {t: showDetail ? 'Client — Nestlé' : 'In meeting', c:'#dfeee2', cl:'#28502e'};
      if (seed === 2) return {t: showDetail ? 'Deep work' : 'In office', c:'#e4dbee', cl:'#4a3a70'};
      return {t: showDetail ? 'Free' : 'In office', c:'#fff', cl:'#555'};
    };
    return h('div', null,
      h(PageTitle, { title:'Executive calendar', sub:'Semi-public. Junior view shows only availability.' }),
      h('div', { className:'new-card', style: { marginBottom: 16, display:'flex', gap: 20, alignItems:'center' } },
        h('label', null, h('input', { type:'checkbox', checked: showDetail, onChange: e => this.setView({calDetail: e.target.checked}) }), ' Admin view (show detail)'),
        showDetail ? h('label', null, h('input', { type:'checkbox', checked: !!revealGaps, onChange: e => this.setView({revealGaps: e.target.checked}) }), ' Reveal Friday gaps') : null
      ),
      h('div', { className:'new-card', style:{padding:0, overflow:'auto'} },
        h('table', { className:'new-table' },
          h('thead', null, h('tr', null, h('th', null, 'Executive'), ...slots.map(s => h('th', {key:s}, s)))),
          h('tbody', null,
            execs.map(e => h('tr', { key: e.id },
              h('td', null,
                h('div', {style:{fontWeight:500}}, e.name),
                h('div', {style:{fontSize:11,color:'var(--stone)'}}, e.role)
              ),
              ...slots.map((s,i) => {
                const st = status(e, i);
                return h('td', { key:s, style: { background: st.c, color: st.cl, fontSize: 12 } }, st.t);
              })
            ))
          )
        )
      )
    );
  }

  renderVals() {
